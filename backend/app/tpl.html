<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
{{HEAD}}
<style>
/* AIIC committee report.
   No scripts, no webfonts, no external requests — the page must render with
   the machine offline. Every value below is inert styling; all report content
   is escaped server-side in app/api/reports.py before it reaches the body
   placeholder below. Do not write a template token inside this stylesheet. */

:root{
  --bg:#0a0a0a; --surface:#121212; --surface-2:#181818;
  --line:#2a2a2a; --line-soft:#1f1f1f;
  --text:#e5e5e5; --text-strong:#ffffff; --muted:#a3a3a3;
  --accent:#22c55e;
  --buy:#22c55e; --watch:#f5b23e; --pass:#9ca3af; --veto:#f87171; --unknown:#a78bfa;
  --dec:var(--accent);
  --radius:10px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:17px;line-height:1.7;
  padding:0 24px 96px;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,h4{color:var(--text-strong);line-height:1.25;text-wrap:balance}
h1{font-size:clamp(1.9rem,5vw,2.6rem);letter-spacing:-.02em;margin:0}
h2{font-size:clamp(1.25rem,3vw,1.5rem);letter-spacing:-.01em;margin:0 0 16px}
h3{font-size:1.05rem;letter-spacing:.01em;margin:24px 0 8px;color:#f1f1f1}
h4{font-size:.95rem;margin:20px 0 6px;color:#dcdcdc}
p{margin:0 0 14px}
p:last-child{margin-bottom:0}
strong{color:var(--text-strong);font-weight:650}
code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
hr{border:none;border-top:1px solid var(--line);margin:28px 0}

a{color:#7dd3a0;text-decoration:underline;text-underline-offset:2px;
  text-decoration-thickness:1px;text-decoration-color:#3f6b52}
a:hover{color:#a7e8c2;text-decoration-color:currentColor}
a:focus-visible,[tabindex]:focus-visible,summary:focus-visible{
  outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#062012;
  padding:10px 16px;border-radius:0 0 var(--radius) 0;font-weight:700;z-index:10}
.skip:focus{left:0}

/* ---------- masthead ---------- */
.masthead{max-width:1160px;margin:0 auto;padding:44px 0 24px;
  border-bottom:2px solid var(--accent)}
.eyebrow{margin:0 0 6px;font-size:.72rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent);font-weight:700}
.meta{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:8px;font-size:.82rem;color:var(--muted)}
.meta-item{background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:2px 10px;white-space:nowrap}
.meta-item.mono{font-size:.74rem;overflow-wrap:anywhere}

/* ---------- layout ---------- */
.layout{max-width:1160px;margin:0 auto}
main{min-width:0}
main > section{padding:28px 0;border-bottom:1px solid var(--line-soft)}
main > section:last-of-type{border-bottom:none}
section{scroll-margin-top:20px}

@media (min-width:1080px){
  .layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:56px;align-items:start}
}

/* ---------- table of contents ---------- */
.toc{padding:24px 0 8px;font-size:.86rem}
.toc-title{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:0 0 10px;font-weight:700}
.toc ol{list-style:none;margin:0;padding:0;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:2px 14px}
.toc a{display:block;padding:5px 8px;border-radius:6px;color:var(--muted);
  text-decoration:none;border-left:2px solid transparent;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc a:hover{color:var(--text-strong);background:var(--surface);border-left-color:var(--accent)}
@media (min-width:1080px){
  .toc{position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:28px 0 28px}
  .toc ol{grid-template-columns:1fr;gap:0}
}

/* ---------- decision hero ---------- */
.hero{
  background:linear-gradient(180deg,var(--surface) 0%,#0d0d0d 100%);
  border:1px solid var(--line);border-left:6px solid var(--dec);
  border-radius:var(--radius);padding:26px 26px 22px;margin:28px 0 8px}
.hero.decision-buy{--dec:var(--buy)}
.hero.decision-watch{--dec:var(--watch)}
.hero.decision-pass{--dec:var(--pass)}
.hero.decision-veto{--dec:var(--veto)}
.hero.decision-unknown{--dec:var(--unknown)}

.hero-top{display:flex;flex-wrap:wrap;gap:20px;align-items:center;
  justify-content:space-between}
.verdict{display:flex;align-items:center;gap:14px;min-width:0}
.verdict-glyph{
  flex:none;width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;font-size:1.4rem;line-height:1;
  color:var(--dec);border:2px solid var(--dec);background:rgba(255,255,255,.04)}
.verdict-word{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:800;
  letter-spacing:-.03em;color:var(--dec);overflow-wrap:anywhere}
.score{text-align:right;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;
  justify-content:flex-end}
.score-num{font-family:var(--mono);font-size:clamp(1.8rem,5vw,2.4rem);
  font-weight:700;color:var(--text-strong);line-height:1}
.score-den{font-family:var(--mono);font-size:1rem;color:var(--muted)}
.score-cap{flex-basis:100%;font-size:.7rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px;margin:22px 0 0;padding:18px 0 0;border-top:1px solid var(--line)}
.fact dt{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:3px}
.fact dd{margin:0;font-size:.98rem;color:var(--text-strong);overflow-wrap:anywhere}
.chair-reasoning{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.chair-reasoning h3{margin-top:0;font-size:.72rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted)}

/* ---------- banners ---------- */
.banner,.veto-banner{display:flex;gap:12px;align-items:flex-start;
  border-radius:var(--radius);padding:14px 16px;font-size:.94rem;margin:20px 0}
.banner-glyph{flex:none;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;font-weight:800;font-size:.85rem;
  border:2px solid currentColor;line-height:1}
.banner-warn{background:#1c1608;border:1px solid #5c4410;color:var(--watch)}
.banner-warn div{color:#f0dfc0}
.banner-warn strong{color:var(--watch)}
.veto-banner{background:#1e0d0d;border:1px solid #6b2020;color:var(--veto);
  margin:22px 0 0}
.veto-banner div{color:#f3d6d6}
.veto-banner strong{color:var(--veto)}
.veto-reason{margin-top:8px;padding-left:12px;border-left:2px solid #6b2020;
  color:#e7c9c9;font-size:.92rem}

/* ---------- score bars ---------- */
.scores{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.score-row{display:grid;grid-template-columns:minmax(96px,1.1fr) minmax(60px,3fr) 46px;
  gap:12px;align-items:center;font-size:.92rem}
.score-label{color:var(--text);overflow-wrap:anywhere}
.bar{display:block;height:9px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line);overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--accent);
  background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.22) 0 4px,transparent 4px 8px)}
.score-val{text-align:right;color:var(--text-strong);font-family:var(--mono);font-size:.86rem}

/* ---------- content blocks ---------- */
ul,ol{padding-left:1.35em;margin:0 0 14px}
li{margin:0 0 7px}
li::marker{color:var(--muted)}
blockquote{margin:0 0 14px;padding:2px 0 2px 14px;border-left:3px solid var(--line);
  color:#cfcfcf}
.ranked li::marker{color:var(--accent);font-weight:700}
.ranked-risk li::marker{color:var(--veto)}
.ranked-opp li::marker{color:var(--buy)}
.ray{border-left:3px solid var(--unknown);padding-left:20px}
.ray-lede p{font-size:1.02rem;color:var(--text-strong)}
.tag{display:inline-block;margin-right:10px;padding:2px 8px;border-radius:5px;
  font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  background:rgba(167,139,250,.14);color:var(--unknown);border:1px solid rgba(167,139,250,.35);
  vertical-align:2px}
.badurl{color:var(--muted);font-family:var(--mono);font-size:.82em;overflow-wrap:anywhere}

/* ---------- tables: never widen the page ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 16px;
  border:1px solid var(--line);border-radius:var(--radius);max-width:100%}
.table-wrap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:.9rem}
th,td{padding:9px 13px;border-bottom:1px solid var(--line);text-align:left;
  vertical-align:top}
tr:last-child th,tr:last-child td{border-bottom:none}
th{background:var(--surface-2);color:var(--text-strong);font-weight:650;
  white-space:nowrap}
td th[scope=row]{white-space:normal}

/* ---------- citations & footnotes ---------- */
sup.cite{font-size:.68em;line-height:0;vertical-align:super;margin-left:1px}
sup.cite a{display:inline-block;min-width:1.05em;padding:0 2px;text-align:center;
  color:var(--accent);text-decoration:none;background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.3);border-radius:3px;font-family:var(--mono)}
sup.cite a:hover{background:rgba(34,197,94,.24);color:#bbf7d0}
sup.cite-dead{color:var(--muted);font-family:var(--mono)}
.footnotes{list-style:none;padding:0;margin:0;display:grid;gap:12px;
  counter-reset:none;font-size:.9rem}
.fn{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:10px;margin:0;
  padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.fn:last-child{border-bottom:none}
.fn:target{background:rgba(34,197,94,.09);border-radius:6px;
  outline:1px solid rgba(34,197,94,.4);padding:8px;margin:-8px -8px 0}
.fn-id{font-family:var(--mono);color:var(--accent);font-size:.82rem;
  text-align:right;padding-top:2px}
.fn-body{min-width:0}
.fn-body a{overflow-wrap:anywhere}
.fn-host{display:inline-block;margin-left:8px;font-family:var(--mono);
  font-size:.72rem;color:var(--muted)}
.fn-kind{display:block;margin-top:3px;font-size:.66rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.fn-supports{display:block;margin-top:3px;color:var(--muted);font-size:.86rem}

.colophon{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
  color:var(--muted);font-size:.8rem}

/* ---------- states & index ---------- */
.state{max-width:640px;margin:0 auto;padding:80px 0}
.state-card{background:var(--surface);border:1px solid var(--line);
  border-left:6px solid var(--muted);border-radius:var(--radius);padding:32px}
.state-missing{border-left-color:var(--pass)}
.state-running{border-left-color:var(--watch)}
.state-failed{border-left-color:var(--veto)}
.state-empty{border-left-color:var(--accent)}
.state-code{margin:0 0 8px;font-family:var(--mono);font-size:.8rem;
  letter-spacing:.2em;color:var(--muted)}
.state-detail{color:var(--text-strong);margin-top:10px}
.btn{display:inline-block;margin-top:14px;padding:9px 18px;border-radius:7px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  text-decoration:none;font-size:.9rem}
.btn:hover{border-color:var(--accent);color:var(--text-strong)}

.index{max-width:1160px;margin:0 auto}
.index-list{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:10px}
.index-row{margin:0}
.index-row a{display:flex;flex-wrap:wrap;align-items:center;gap:14px;
  padding:16px 18px;background:var(--surface);border:1px solid var(--line);
  border-left:5px solid var(--dec,var(--muted));border-radius:var(--radius);
  text-decoration:none;color:var(--text)}
.index-row a:hover{background:var(--surface-2);border-color:#3a3a3a}
.index-row.decision-buy{--dec:var(--buy)}
.index-row.decision-watch{--dec:var(--watch)}
.index-row.decision-pass{--dec:var(--pass)}
.index-row.decision-veto{--dec:var(--veto)}
.index-row.decision-unknown{--dec:var(--unknown)}
.index-glyph{flex:none;width:30px;height:30px;border-radius:50%;display:grid;
  place-items:center;font-size:.85rem;color:var(--dec,var(--muted));
  border:2px solid var(--dec,var(--muted))}
.index-name{font-weight:650;color:var(--text-strong);font-size:1.05rem}
.index-row .meta{margin:0 0 0 auto}

/* ---------- print / PDF ---------- */
@media print{
  @page{margin:16mm}
  html{scroll-behavior:auto}
  body{background:#fff;color:#111;font-size:10.5pt;line-height:1.5;padding:0}
  h1,h2,h3,h4{color:#000}
  .skip,.toc,.btn{display:none !important}
  .layout{display:block;max-width:none}
  .masthead{border-bottom:2pt solid #111;padding-top:0}
  .eyebrow{color:#444}
  .meta-item{background:none;border:none;padding:0;color:#444}
  .meta-item::after{content:" · "}
  .meta-item:last-child::after{content:""}

  .hero{background:none;border:1pt solid #111;border-left:6pt solid #111;
    padding:14pt;break-inside:avoid}
  .verdict-glyph{border-color:#111;color:#111;background:none;
    width:34pt;height:34pt}
  .verdict-word,.score-num,.fact dd{color:#000}
  .fact dt,.score-cap,.score-den{color:#444}
  .facts,.chair-reasoning{border-top:.5pt solid #999}

  .veto-banner{background:none;border:1.5pt solid #111;color:#000}
  .veto-banner div,.veto-banner strong,.veto-reason{color:#000}
  .banner-warn{background:none;border:1pt solid #666;color:#000}
  .banner-warn div,.banner-warn strong{color:#000}

  main > section{border-bottom:.5pt solid #ccc;padding:12pt 0;break-inside:auto}
  h2{break-after:avoid;border-bottom:.5pt solid #ccc;padding-bottom:4pt}
  h3,h4{break-after:avoid}

  .table-wrap{overflow:visible;border:.5pt solid #999;border-radius:0}
  table{min-width:0;font-size:9pt}
  th{background:#eee;color:#000}
  th,td{border-bottom:.5pt solid #bbb}

  .bar{border:.5pt solid #333;background:#fff;height:7pt}
  .bar-fill{background:#333;background-image:none}
  .score-val,.score-label{color:#000}

  sup.cite a{color:#000;background:none;border:.5pt solid #666}
  .fn{break-inside:avoid;border-bottom:.5pt solid #ddd}
  .fn-id{color:#000}
  .fn-host,.fn-kind,.fn-supports,.muted,.colophon{color:#444}
  a{color:#000;text-decoration:underline}
  .footnotes a[href^="http"]::after{content:" \00a0" attr(href);
    font-family:var(--mono);font-size:8pt;color:#555;word-break:break-all}
  .ray{border-left:2pt solid #111;padding-left:12pt}
  .tag{background:none;border:.5pt solid #666;color:#000}
  .colophon{border-top:.5pt solid #999}
}
</style>
</head>
